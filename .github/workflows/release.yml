name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (optional — auto-increments patch if empty)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          bump_patch() {
            local ver="${1#v}"
            local major minor patch
            IFS='.' read -r major minor patch _ <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            echo "${major}.${minor}.$((patch + 1))"
          }

          current_from_pubspec() {
            sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' flutter_app/pubspec.yaml | head -1
          }

          set_pubspec_version() {
            local ver="$1"
            sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?/version: ${ver}+1/" flutter_app/pubspec.yaml
            rm -f flutter_app/pubspec.yaml.bak
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1)
              if [ -n "$LATEST_TAG" ]; then
                VERSION=$(bump_patch "$LATEST_TAG")
              else
                VERSION=$(current_from_pubspec)
              fi
            fi
            TAG="v${VERSION}"

            set_pubspec_version "$VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter_app/pubspec.yaml
            if ! git diff --cached --quiet; then
              git commit -m "Release ${TAG}"
              git push origin HEAD:master
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync pubspec version
        run: |
          sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?/version: ${{ needs.prepare.outputs.version }}+1/" pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package zip
        run: |
          mkdir -p ../release
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Panorama.app \
            ../release/Panorama-${{ needs.prepare.outputs.version }}-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panorama-macOS
          path: release/Panorama-*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.deb_arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            flutter_arch: x64
            deb_arch: amd64
          # Native arm64 runner (public repos). Flutter does not cross-compile linux-arm64.
          - runner: ubuntu-24.04-arm
            flutter_arch: arm64
            deb_arch: arm64
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev dpkg-dev
          # clang needs matching libstdc++ headers (version varies by Ubuntu).
          sudo apt-get install -y libstdc++-14-dev \
            || sudo apt-get install -y libstdc++-12-dev \
            || sudo apt-get install -y libstdc++-dev

      - name: Setup Flutter
        if: matrix.deb_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter does not publish linux-arm64 SDK zips on the stable channel that
      # flutter-action can resolve, so clone the stable branch instead.
      - name: Setup Flutter (arm64)
        if: matrix.deb_arch == 'arm64'
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Bootstrap Flutter (arm64)
        if: matrix.deb_arch == 'arm64'
        working-directory: .
        run: |
          flutter config --no-analytics
          flutter precache --linux
          flutter doctor -v

      - name: Sync pubspec version
        run: |
          sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?/version: ${{ needs.prepare.outputs.version }}+1/" pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package .deb
        working-directory: .
        run: |
          ./scripts/package-deb.sh \
            "${{ needs.prepare.outputs.version }}" \
            "flutter_app/build/linux/${{ matrix.flutter_arch }}/release/bundle" \
            release \
            "${{ matrix.deb_arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panorama-Linux-${{ matrix.deb_arch }}
          path: release/Panorama-*-linux-${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows (installer)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync pubspec version
        shell: bash
        run: |
          sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?/version: ${{ needs.prepare.outputs.version }}+1/" pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Package installer
        working-directory: .
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -Version "${{ needs.prepare.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panorama-Windows
          path: release/Panorama-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Panorama-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Panorama ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          body: |
            ### macOS
            - Download the **`.zip`**, unzip it, and drag **Panorama.app** into **Applications**
            - First launch: **right-click → Open → Open** (unsigned build; one-time Gatekeeper prompt)
            - Or use the repo launcher: `./scripts/install-mac.sh` after building locally

            ### Linux
            - Download the **`.deb`** matching your CPU:
              - **x86_64:** `Panorama-${{ needs.prepare.outputs.version }}-linux-amd64.deb`
              - **ARM64:** `Panorama-${{ needs.prepare.outputs.version }}-linux-arm64.deb`
            - Install with:
              ```bash
              sudo apt install ./Panorama-*-linux-*.deb
              ```
            - Requires GTK 3 (Ubuntu/Debian desktop)

            ### Windows
            - Download **`Panorama-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe`** and run it
            - Installs per-user under `%LOCALAPPDATA%\Programs\Panorama` (no admin required)
            - First launch may show a SmartScreen prompt for an unsigned build — choose **More info → Run anyway**
          files: dist/*
